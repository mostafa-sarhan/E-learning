# HOST Nginx site for the academy (Docker setup). Install as a NEW file:
#   /etc/nginx/sites-available/academy  (+ symlink in sites-enabled)
# Do not edit nginx.conf or other projects' site files.
#
# Placeholders:
#   academy.example.com -> academy subdomain (must not match another site's server_name)
#   8084                -> ACADEMY_FRONTEND_PORT from the academy .env
#
# Traffic: client -> this Nginx (HTTPS) -> academy-frontend container (static SPA + /api proxy)
#          -> academy-backend container. Backend uses TRUST_PROXY=2 for this chain.

# Per-IP flood guard (zone names are global: keep it unique).
limit_req_zone $binary_remote_addr zone=academy_req:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name academy.example.com;
    # `sudo certbot --nginx -d academy.example.com` adds the 443 block and the HTTP->HTTPS redirect.

    server_tokens off;
    client_max_body_size 1m;

    location / {
        limit_req zone=academy_req burst=150 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (not append): clients cannot spoof their IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
