# Nginx site for the Academy ONLY. Install as a new file in sites-available.
# Do not edit nginx.conf, conf.d defaults, or LearnGate's site files.
#
# Placeholders to replace:
#   academy.example.com  -> the academy's domain (must differ from LearnGate's server_name)
#   127.0.0.1:5000       -> must match HOST/PORT in Backend-learning/.env
#   /var/www/academy/frontend -> where the built frontend (dist/) is copied

# Flood guard per client IP. The app enforces finer per-user limits itself.
# Zone name is global across all sites: keep it unique to this app.
limit_req_zone $binary_remote_addr zone=academy_api:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name academy.example.com;
    # `certbot --nginx -d academy.example.com` adds the 443 block and HTTP->HTTPS redirect.

    root /var/www/academy/frontend;
    index index.html;

    client_max_body_size 1m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        limit_req zone=academy_api burst=150 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (not append) X-Forwarded-For so clients cannot spoof their IP.
        # Matches TRUST_PROXY=1 in the backend .env.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Vite emits content-hashed files: cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA routes (/login, /dashboard, /student-portal, ...). Never cache index.html.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }

    # Never serve dotfiles (.env, .git) even if misplaced into the web root.
    location ~ /\. {
        deny all;
    }
}
