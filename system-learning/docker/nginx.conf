# Serves the SPA and proxies /api to the backend on the private Compose network.
# Host Nginx terminates HTTPS and forwards to this container.

# Docker's embedded DNS; re-resolve the backend if its container is recreated.
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API: never falls through to the SPA. Path is preserved (/api/... -> backend /api/...).
    location /api/ {
        set $academy_backend http://academy-backend:5000;
        proxy_pass $academy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Appends the host Nginx address to the client IP set by host Nginx
        # (backend uses TRUST_PROXY=2 to read the real client IP).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        # The Authorization header is forwarded unchanged by default.
    }

    # Content-hashed Vite assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback for React Router.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
